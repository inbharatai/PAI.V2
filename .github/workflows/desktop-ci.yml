name: Desktop CI

on:
  push:
    branches: [ main, desktop/production-foundation ]
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'vendor/Inbharat-audiocpp/**'
      - 'scripts/check_speech_language_sync.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'vendor/Inbharat-audiocpp/**'
      - 'scripts/check_speech_language_sync.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-protection:
    name: Verify Mobile Untouched
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify no Android files changed
        shell: bash
        run: |
          # Tree-pinned baseline (see mobile-protection.yml): the expected tree
          # hash lives in a committed pointer file, so re-baselining is a
          # reviewable commit rather than a workflow edit or a tag move.
          PROTECTED_PATH="android-app/UnoOneAgent"
          POINTER_FILE="scripts/MOBILE_PROTECTED_TREE"

          if [ ! -f "$POINTER_FILE" ]; then
            echo "FAIL: baseline pointer missing at $POINTER_FILE"
            exit 1
          fi

          EXPECTED_TREE=$(tr -d '[:space:]' < "$POINTER_FILE")
          ACTUAL_TREE=$(git rev-parse "HEAD:${PROTECTED_PATH}")

          if [ "$ACTUAL_TREE" != "$EXPECTED_TREE" ]; then
            echo "FAIL: protected path changed without re-baselining."
            echo "  expected tree : $EXPECTED_TREE  (from $POINTER_FILE)"
            echo "  actual tree   : $ACTUAL_TREE"
            echo ""
            git diff --name-status "$EXPECTED_TREE" "$ACTUAL_TREE" || true
            exit 1
          fi

          echo "PASS: protected tree matches committed baseline ($ACTUAL_TREE)"

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/desktop/src/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop/src
        run: npm ci

      - name: Build frontend
        working-directory: apps/desktop/src
        run: npm run build

  speech-language-sync:
    name: Speech language table sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The canonical speech language table is packages/speech-contracts/
      # languages.v1.json; the Android mirror in VoiceLanguage.kt must stay
      # identical. android-ci.yml runs this same check for Android-path
      # changes; this job catches Rust/JSON-side edits that must not drift.
      - name: Kotlin mirror == languages.v1.json
        run: python3 scripts/check_speech_language_sync.py

  vendor-audio-linux:
    name: InBharat Audio (Linux, ctest + ABI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential python3

      # Default (adapter-OFF) build of the universal speech runtime: every
      # release-candidate test suite runs, then the exported ELF symbol set
      # must match the reviewed ABI v1 core manifest byte-for-byte. This is
      # CI evidence only — it never claims a physical Linux deployment.
      - name: Configure
        run: >
          cmake -S vendor/Inbharat-audiocpp -B build/ibaudio -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DIBAUDIO_BUILD_TESTS=ON
          -DIBAUDIO_BUILD_CLI=ON
          -DIBAUDIO_ENABLE_AUDIO_CPP_ADAPTER=OFF
          -DIBAUDIO_ENABLE_SHERPA_ONNX=OFF
          -DIBAUDIO_ENABLE_VULKAN_PROBE=OFF

      - name: Build
        run: cmake --build build/ibaudio --parallel 2

      - name: Release-candidate tests
        run: ctest --test-dir build/ibaudio --output-on-failure

      - name: ABI invariant check
        run: >
          python3 vendor/Inbharat-audiocpp/scripts/check_abi.py
          build/ibaudio/libibaudio.so
          vendor/Inbharat-audiocpp/abi/ibaudio_symbols_v1_core.txt

  rust-check:
    name: Rust Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      # Tauri v2 on Linux links webkit2gtk; without the dev packages the
      # workspace check fails before any Rust code is compiled.
      - name: Install Linux GUI dependencies (tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      # generate_context! embeds the frontend at compile time (custom-protocol
      # is a default feature), so the dist must exist before ANY cargo command,
      # including cargo check. Each matrix runner builds it independently.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/desktop/src/package-lock.json

      - name: Build desktop frontend
        working-directory: apps/desktop/src
        run: |
          npm ci
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.os }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: cargo-${{ matrix.os }}-

      - name: cargo fmt
        run: cargo fmt --check
        continue-on-error: true

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        shell: bash
        run: |
          FOUND=0
          # Check for common secret patterns
          for PATTERN in "password\s*=\s*['\"][^'\"]{8,}['\"]" "api_key\s*=\s*['\"][^'\"]+['\"]" "secret\s*=\s*['\"][^'\"]+['\"]" "token\s*=\s*['\"][^'\"]+['\"]"; do
            if grep -rPn "$PATTERN" apps/desktop/src-tauri/src/ apps/desktop/src/src/ packages/vault-core/src/ --include="*.rs" --include="*.ts" --include="*.tsx" 2>/dev/null; then
              FOUND=1
            fi
          done
          if [ "$FOUND" = "1" ]; then
            echo "FAIL: Potential hardcoded secrets found"
            exit 1
          fi
          echo "PASS: No hardcoded secrets detected"

  artifact-scan:
    name: Artifact Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for binary artifacts in git
        shell: bash
        run: |
          FOUND=0
          # Check for model binaries, DLLs, executables that should not be in git
          for EXT in ".gguf" ".dll" ".so" ".dylib" ".apk" ".aab"; do
            if git ls-files -- "*.${EXT#*.}" 2>/dev/null | head -1 | grep -q "."; then
              echo "FAIL: Found ${EXT} files in git"
              git ls-files -- "*${EXT}"
              FOUND=1
            fi
          done
          # Check for target/ directory (build artifacts)
          if git ls-files -- "apps/desktop/src-tauri/target/" 2>/dev/null | head -1 | grep -q "."; then
            echo "FAIL: Found target/ directory in git"
            FOUND=1
          fi
          # Check for Cargo.lock in VCS (should be in .gitignore for apps)
          if git ls-files -- "apps/desktop/src-tauri/Cargo.lock" 2>/dev/null | head -1 | grep -q "."; then
            echo "WARN: Cargo.lock is tracked — should be in .gitignore for apps"
          fi
          if [ "$FOUND" = "1" ]; then
            exit 1
          fi
          echo "PASS: No binary artifacts in git"
