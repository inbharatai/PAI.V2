[package]
name = "unoone-local-peer-sync"
version = "0.1.0"
edition = "2021"
description = "Opt-in pinned TLS local peer record exchange; inert conflict review only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
rcgen = { version = "=0.13.2", default-features = false, features = ["ring", "crypto"] }
unoone-vault-core = { path = "../vault-core" }
unoone-personal-agent-runtime = { path = "../personal-agent-runtime" }
unoone-personal-agent-contracts = { path = "../personal-agent-contracts" }
