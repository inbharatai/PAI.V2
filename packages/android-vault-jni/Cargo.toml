[package]
name = "unoone-android-vault-jni"
version = "0.1.0"
edition = "2021"
publish = false
# License declaration intentionally pending owner approval.
description = "Bounded Android JNI adapter to existing vault-core production KDF"

[lib]
name = "unoone_android_vault_jni"
crate-type = ["cdylib", "rlib"]

[dependencies]
unoone-vault-core = { path = "../vault-core" }
jni = "=0.21.1"
zeroize = "=1.9.0"

[dev-dependencies]
serde_json = "1"
hex = "0.4"
