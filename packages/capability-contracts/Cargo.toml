[package]
name = "unoone-capability-contracts"
version = "0.1.0"
edition = "2021"
description = "Shared capability record contracts for PAI V2 (perception observations, bounded MK-style environment learning, procedure outcomes, audio backend status, device capability manifests). The JSON document is the single source of truth; these types + invariants are the Rust embed. Dependency-light on purpose so the same JSON stays readable by the Android-side mirrors (added with their first Kotlin consumer)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"