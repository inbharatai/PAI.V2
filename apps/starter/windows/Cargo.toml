[package]
name = "unoone-starter-windows"
version = "0.1.0"
description = "Signed-ready one-click starter for UnoOne Pocket AI"
edition = "2021"

[[bin]]
name = "start-unoone"
path = "src/main.rs"

# Windows identity (2026-10-02): build-only, embeds icon.ico into the exe
# resource section via rc.exe — no runtime dependency.
[build-dependencies]
winresource = "0.1"

[dependencies]
serde_json = "1"
unoone-usb-manifest = { path = "../../../packages/usb-manifest" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
