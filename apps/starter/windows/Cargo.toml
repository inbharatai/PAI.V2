[package]
name = "unoone-starter-windows"
version = "0.1.0"
description = "Signed-ready one-click starter for UnoOne Pocket AI"
edition = "2021"

[[bin]]
name = "start-unoone"
path = "src/main.rs"

[dependencies]
serde_json = "1"
unoone-usb-manifest = { path = "../../../packages/usb-manifest" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
