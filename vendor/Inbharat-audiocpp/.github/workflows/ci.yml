name: native-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@v3.31.6
      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DIBAUDIO_BUILD_TESTS=ON -DIBAUDIO_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure --parallel 2
      - name: ABI exports (ELF)
        if: runner.os == 'Linux'
        run: python3 scripts/check_abi.py build/ci/libibaudio.so abi/ibaudio_symbols_v1.txt
      - name: Fixture reproducibility
        if: runner.os != 'Windows'
        run: sh scripts/verify_fixtures.sh

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@v3.31.6
      - name: Configure ASan and UBSan
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build/sanitizers -G Ninja -DCMAKE_BUILD_TYPE=Debug -DIBAUDIO_ENABLE_SANITIZERS=ON -DIBAUDIO_BUILD_TESTS=ON
      - run: cmake --build build/sanitizers --parallel 2
      - name: Test ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/sanitizers --output-on-failure --parallel 1

  android-arm64-build-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Configure arm64 CPU
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: >-
          cmake -S . -B build/android-ci -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_shared
          -DIBAUDIO_BUILD_CLI=OFF -DIBAUDIO_BUILD_TESTS=OFF
          -DIBAUDIO_BUILD_ANDROID_JNI=ON -DIBAUDIO_ENABLE_VULKAN_PROBE=OFF
      - name: Build arm64 libraries
        run: cmake --build build/android-ci --target ibaudio ibaudio_jni --parallel 2
