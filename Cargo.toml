[workspace]
members = [
    "packages/vault-core",
    "packages/android-vault-jni",
    "packages/usb-manifest",
    "packages/recording-policy",
    "packages/text-util",
    "packages/runtime-select",
    "packages/document-migration",
    "packages/browser-policy",
    "packages/pai-harness-adapter",
    "packages/speech-contracts",
    "packages/tool-contracts",
    "packages/capability-contracts",
    "packages/personal-agent-contracts",
    "packages/personal-agent-runtime",
    "packages/personal-provider-adapters",
    "packages/privacy-guardian",
    "packages/local-peer-sync",
    "packages/model-admission",
    "apps/desktop/src-tauri",
    "apps/dock/windows",
    "apps/starter/windows",
]
# vendor/inbharat-harness is a SELF-CONTAINED nested Cargo workspace (its own
# [workspace] + [workspace.package] root at vendor/inbharat-harness/Cargo.toml).
# Without this exclude, cargo would treat vendored crates as members of THIS
# outer workspace and try to resolve their `*.workspace = true` inheritance
# against this root — which has no [workspace.package] — and fail with
# "workspace.package.edition was not defined". Excluding the vendored tree
# makes cargo resolve inheritance against the harness's own inner root, while
# the explicit path dependencies below still load normally.
exclude = ["vendor/inbharat-harness"]
resolver = "2"

# Argon2id (256 MiB, 3 passes) is ~13x slower unoptimised, and the test suites
# create and unlock many vaults. Optimise only these crates in dev/test builds
# (release builds are unaffected; no behavioural change).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
